server:
  port: 8083
  tomcat:
    threads:
      max: 200
    accept-count: 100

spring:
  application:
    name: notificacoes-rest

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/notificacoes}
    username: ${SPRING_DATASOURCE_USERNAME:tcc}
    password: ${SPRING_DATASOURCE_PASSWORD:tcc}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: notificacoes-rest

logging:
  level:
    root: INFO
    br.uva.tcc: INFO
