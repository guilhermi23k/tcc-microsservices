server:
  port: 8082
  tomcat:
    threads:
      max: 200
    accept-count: 100

spring:
  application:
    name: estoque-rest

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/estoque}
    username: ${SPRING_DATASOURCE_USERNAME:tcc}
    password: ${SPRING_DATASOURCE_PASSWORD:tcc}
    hikari:
      maximum-pool-size: 30

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: estoque-rest

logging:
  level:
    root: INFO
    br.uva.tcc: INFO
